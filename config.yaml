# ContinuityGuard settings. Change the model here; nothing else needs to change.
model:
  # Any OpenAI-compatible endpoint works (Gemini, OpenAI, Anthropic compat, Groq, OpenRouter, local vLLM/Ollama).
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  name: gemini-flash-latest
  fallbacks: [gemini-flash-lite-latest]   # the notebook replaces this with every model your key can reach
  api_key_env: [LLM_API_KEY, GEMINI_API_KEY]   # env vars or Colab secrets checked in this order
  temperature: 0
  json_mode: true
  timeout_s: 300
  max_retries: 4
  parallel_requests: 2             # requests in flight at once (free tiers allow only a few per minute)
  min_seconds_between_calls: 3     # spacing between request starts
  max_output_tokens: 60000         # long enough for 10 episodes of extracted facts
  extra_body: {}                   # provider-specific options, passed through as-is

reader:
  episodes_per_call: 10            # fewer, larger requests suit per-minute request limits
  include_camera_blocks: true      # camera lines carry most appearance details

judge:
  candidates_per_call: 20
  max_examples_per_member: 3

thresholds:
  flag_confidence: 0.7             # below this, an issue goes to "needs review" instead of "flag"
  spelling_similarity: 0.88        # Jaro-Winkler threshold for code-side spelling variants

baseline:
  max_chars_per_call: 450000       # whole show in one prompt; split automatically if the model refuses

pricing_usd_per_million_tokens:    # fill in to get cost estimates (left empty on purpose)
  input: null
  output: null
